name: Update SOCKS4 Proxy List

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update proxies
        run: |
          curl -s "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks4.txt" > all.txt
          curl -s "https://raw.githubusercontent.com/dpangestuw/Free-Proxy/refs/heads/main/socks4_proxies.txt" >> all.txt
          curl -s "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=socks4.txt&timeout=10000&country=all" >> all.txt
          curl -s "https://raw.githubusercontent.com/Vann-Dev/proxy-list/main/proxies/socks4.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/zebbern/Proxy-Scraper/main/socks4.txt" >> all.txt
          curl -s "https://proxyspace.pro/socks4.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/ProxyScraper/ProxyScraper/main/socks4.txt" >> all.txt
          curl -s "https://www.flashproxy.com/api/proxies/txt?protocol=socks4&limit=1000" >> all.txt
          curl -s "https://raw.githubusercontent.com/handeveloper1/DailyProxy---Auto-Update-List/refs/heads/main/Proxies-Ercin/socks4.txt" >> all.txt
          curl -s "https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/proxies/protocols/socks4/data.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/VPSLabCloud/VPSLab-Free-Proxy-List/refs/heads/main/socks4_all.txt" >> all.txt
          curl -s "https://www.socks-proxy.net/" >> all.txt
          curl -s "https://raw.githubusercontent.com/iplocate/free-proxy-list/refs/heads/main/protocols/socks4.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/hendrikbgr/Free-Proxy-Repo/refs/heads/master/proxy_list.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/ALIILAPRO/Proxy/main/socks4.txt" >> all.txt        
          grep -Eo '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:[0-9]{2,5}' all.txt | sort -u -o all.txt
          

      - name: Commit and push updated file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          date -u > timestamp.txt
          git add all.txt timestamp.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update HTTP proxy list and keepalive timestamp" && git push)
